<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>XYZZ+双ADP 移液机械臂 装配预览</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
       background: #1a1d23; color: #abb2bf; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
#info { padding: 12px 20px; background: #21252b; border-bottom: 1px solid #333;
        font-size: 12px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
#info .label { color: #61afef; font-weight: 600; }
#info .value { color: #e5c07b; }
#parts { display: flex; gap: 10px; align-items: center; margin-left: auto; flex-wrap: wrap; }
#parts .part { padding: 4px 8px; border-rdius: 4px; font-size: 11px; cursor: pointer;
               border: 1px solid #333; transition: all 0.2s; }
#parts .part:hover { border-color: #61afef; }
#parts .part.active { background: #61afef; color: #1a1d23; border-color: #61afef; }
#canvas { flex: 1; position: relative; }
#controls { position: absolute; bottom: 16px; left: 16px; background: rgba(33,37,43,0.9);
            padding: 8px 12px; border-radius: 6px; font-size: 11px; color: #888; }
#status-line { position: absolute; bottom: 16px; right: 16px; background: rgba(33,37,43,0.9);
               padding: 8px 12px; border-radius: 6px; font-size: 11px; color: #e5c07b; }
</style>
</head>
<body>
<div id="info">
  <span><span class="label">装配:</span> <span class="value">XYZZ+双ADP 移液机械臂</span></span>
  <span><span class="label">总三角面:</span> <span class="value">1,406,106</span></span>
  <span><span class="label">零件数:</span> <span class="value">6</span></span>
  <div id="parts">
    <span class="part active" data-part="all">全部</span>
    <span class="part" data-part="pipette_group1">框架</span>
    <span class="part" data-part="pipette_group2">横梁</span>
    <span class="part" data-part="pipette_group3">中梁</span>
    <span class="part" data-part="pipette_group4">ADP-1</span>
    <span class="part" data-part="pipette_group5">ADP-2</span>
    <span class="part" data-part="pipette_tip">移液头</span>
  </div>
</div>
<div id="canvas"></div>
<div id="controls">鼠标拖拽旋转 | 滚轮缩放 | 右键平移 | 点击零件名筛选</div>
<div id="status-line">加载中...</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const container = document.getElementById('canvas');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1e2127');
scene.fog = new THREE.Fog('#1e2127', 1500, 4000);

// Assembly: X[4.6–427.7] Y[3.1–477.3] Z[14.8–796.4], center ~(216, 240, 406)
// Base: ~423×782mm, Height: ~474mm
const camera = new THREE.PerspectiveCamera(45, 1, 1, 5000);
camera.position.set(600, 600, 900);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(216, 240, 406);
controls.update();

scene.add(new THREE.AmbientLight('#8899bb', 1.8));
const key = new THREE.DirectionalLight('#fffef5', 4);
key.position.set(600, 800, 600);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 10;
key.shadow.camera.far = 3000;
key.shadow.camera.left = -600;
key.shadow.camera.right = 600;
key.shadow.camera.top = 600;
key.shadow.camera.bottom = -400;
scene.add(key);
scene.add(new THREE.DirectionalLight('#aaccff', 1.5));

const grid = new THREE.GridHelper(1000, 20, '#4a4f59', '#2a2d33');
grid.position.set(216, 0, 406);
scene.add(grid);

// Axes helper for orientation
scene.add(new THREE.AxesHelper(300));

// Debug: X,Y,Z labels at axis ends
(function addAxisLabels() {
  function lbl(text, x, y, z, color) {
    const c = document.createElement('canvas'); c.width=128; c.height=128;
    const t = c.getContext('2d');
    t.fillStyle=color; t.font='bold 80px Arial'; t.textAlign='center'; t.textBaseline='middle';
    t.fillText(text, 64, 64);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), depthTest:false}));
    s.position.set(x, y, z); s.scale.set(35, 35, 1); return s;
  }
  scene.add(lbl('X', 330, 0, 0, '#ff4444'));
  scene.add(lbl('Y', 0, 330, 0, '#44ff44'));
  scene.add(lbl('Z', 0, 0, 330, '#4488ff'));
})();

// Part definitions — vertices in assembly world coordinates, NO centering
const parts = [
  { name: 'pipette_group1', color: 0x6a8caf, label: '主框架' },
  { name: 'pipette_group2', color: 0x7a9f6a, label: '横梁' },
  { name: 'pipette_group3', color: 0x8a6a9f, label: '中梁' },
  { name: 'pipette_group4', color: 0xaf8a6a, label: 'ADP模块1' },
  { name: 'pipette_group5', color: 0x9f6a7a, label: 'ADP模块2' },
  { name: 'pipette_tip',   color: 0xcccccc, label: '移液头' },
];

const meshes = {};
const totalParts = parts.length;
let loadedCount = 0;
const statusEl = document.getElementById('status-line');

window.togglePart = function(partName) {
  document.querySelectorAll('#parts .part').forEach(el => {
    el.classList.toggle('active', el.dataset.part === partName);
  });
  Object.entries(meshes).forEach(([name, mesh]) => {
    mesh.visible = (partName === 'all' || name === partName);
  });
};

document.querySelectorAll('#parts .part').forEach(el => {
  el.addEventListener('click', () => window.togglePart(el.dataset.part));
});

const loader = new STLLoader();

parts.forEach(({ name, color, label }) => {
  loader.load('../models/pipette_arm/' + name + '.stl',
    (geometry) => {
      // NO centering — vertices are in global assembly coordinates from STEP split

      const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
        color: color, roughness: 0.3, metalness: 0.7
      }));

      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.name = name;

      scene.add(mesh);
      meshes[name] = mesh;

      loadedCount++;
      if (loadedCount === totalParts) {
        statusEl.textContent = '全部加载完成';
        statusEl.style.color = '#98c379';
        console.log('[Assembly] All pipette parts loaded:', Object.keys(meshes));
      } else {
        statusEl.textContent = '已加载 ' + loadedCount + '/' + totalParts;
      }
    },
    undefined,
    (error) => {
      console.error('[STL] Error loading ' + name + ':', error);
      statusEl.textContent = '加载失败: ' + name;
      statusEl.style.color = '#e06c75';
      loadedCount++;
    }
  );
});

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

(function render() {
  requestAnimationFrame(render);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
