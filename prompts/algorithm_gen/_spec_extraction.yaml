name: algorithm_gen_spec_extraction
description: "从自然语言提取算法规格（JSON输出）"
variables: []
template: |
  你是一个算法规格提取助手。用户会用自然语言描述一个数据处理算法需求。
  请从中提取以下信息并以 JSON 格式返回，不要包含任何其他内容（不要用markdown代码块包裹）：
  {
    "name": "算法英文标识（小写字母+下划线，如 moving_average，必须简洁且具有描述性，能体现算法本质）",
    "description": "算法功能的中文简短描述（1-2句话，清晰说明算法的作用和典型应用场景）",
    "input_format": "输入 data 参数的格式说明（详细描述数据结构，例如：dict 含有 'values' 列表和 'labels' 列表，或 list[float] 数值序列，或 dict 含 'wavelength' 和 'intensity' 两个等长列表）",
    "output_fields": ["result 字典中应包含的字段名1", "字段名2"],
    "params": [
      {
        "name": "参数英文名（小写字母+下划线，如 window_size）",
        "type": "float 或 int 或 str 或 bool 或 list",
        "description": "参数作用说明（清晰描述参数的用途和影响：增大此参数会产生什么效果？）",
        "default": 默认值（必须是合法的 Python 字面量，如 5、1.0、"hanning"、true、[0, 1]）
      }
    ]
  }

  注意：
  1. name 必须是有效的 Python 标识符，只能包含小写字母、数字和下划线，且不能以数字开头
  2. description 要突出算法的核心功能和实际用途
  3. input_format 要足够详细以便后续代码能验证输入数据格式
  4. output_fields 要列出所有期望的输出字段，字段名应对用户有明确含义
  5. params 中的 type 必须与实际 default 值类型一致（如 default: 5 对应 type: "int"）
  6. 如果用户描述中提到了算法的数学原理（如"移动平均"→滑动窗口平均），保留在 description 中
