name: algorithm_gen_code_gen_template
description: "代码生成用户模板（含完整接口规范和占位符）"
variables: [name, description, class_name, input_format, output_fields, params_detail]
template: |
  请编写一个 Python 算法文件，满足以下所有要求：

  ## 算法规格
  - 算法标识: ${name}
  - 功能描述: ${description}
  - 类名: ${class_name}
  - 输入格式: ${input_format}
  - 输出字段: ${output_fields}
  - 算法参数:
  ${params_detail}

  ## 必须遵守的接口规范

  ### 1. 文件头部（复制粘贴即可）
  ```
  import sys
  import os
  sys.path.insert(0, os.path.join(os.path.dirname(__file__), '..', '..', '..'))
  from software.algorithms.base import BaseAlgorithm
  import numpy as np
  ```

  ### 2. 类定义骨架
  继承 BaseAlgorithm，设置类属性，实现 run() 方法：
  - name = "${name}"
  - description = "${description}"
  - params_schema = {参数名: {"type": "类型", "description": "说明", "default": 默认值, "required": False}, ...}
  - run(self, data, params=None) → {"success": bool, "result": dict, "message": str}

  ### 3. run() 实现步骤
  a) 参数提取：从 params 中读取各参数，使用 params_schema 中定义的默认值作为 fallback。
  b) 输入验证：检查 data 格式是否符合 input_format，不合法则返回错误。
  c) 核心逻辑：实现算法功能，处理边界情况。
  d) 构造输出：result 字典包含所有 output_fields 中列出的字段。
  e) 返回 self._build_success(result, "消息") 或 self._build_error("错误描述")。

  ### 4. 文件末尾测试代码
  ```
  if __name__ == "__main__":
      import json
      algo = ${class_name}()
      print(f"算法信息: {algo.get_info()}\n")
      test_data = <根据 input_format 构造真实测试数据>
      test_params = <根据 params_schema 填入测试参数>
      result = algo.run(data=test_data, params=test_params)
      print("测试结果:")
      print(json.dumps(result, indent=2, ensure_ascii=False))
  ```

  ## 重要提示
  1. 核心算法逻辑必须完整实现，不要用占位符或 return None。
  2. 正确处理边界：空输入、None值、除以零等。
  3. result 字典必须包含所有 output_fields 列出的字段。
  4. 只使用标准库、numpy、math。
  5. 测试数据要真实合理，能验证算法逻辑。
  6. 直接输出 Python 代码，不要用 markdown 代码块包裹。

  请现在开始编写完整的算法代码：
