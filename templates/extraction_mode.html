<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF提取模式切换</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f3f4f6;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1f2937;
            margin-bottom: 10px;
        }
        .current-mode {
            background: #eff6ff;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-size: 1.1rem;
            font-weight: bold;
            color: #1e40af;
        }
        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }
        .mode-btn {
            padding: 15px 20px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .mode-btn:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        .mode-btn.active {
            border-color: #10b981;
            background: #d1fae5;
        }
        .mode-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .mode-desc {
            color: #6b7280;
            font-size: 0.9rem;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }
        .status.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
        .info-box {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }
        .info-box h3 {
            margin-top: 0;
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📄 PDF提取模式切换</h1>
        <p style="color: #6b7280;">选择PDF文献提取时使用的模式</p>

        <div class="current-mode" id="currentMode">
            当前模式: 加载中...
        </div>

        <div class="mode-buttons">
            <button class="mode-btn" data-mode="hybrid">
                <div class="mode-title">🎯 混合模式 (推荐)</div>
                <div class="mode-desc">智能判断内容复杂度，自动选择最优方案，节省60-80%成本</div>
            </button>

            <button class="mode-btn" data-mode="vision">
                <div class="mode-title">🖼️ 纯视觉模式</div>
                <div class="mode-desc">将PDF转图片后用Vision API分析，准确但成本高</div>
            </button>

            <button class="mode-btn" data-mode="text">
                <div class="mode-title">📝 纯文本模式</div>
                <div class="mode-desc">提取PDF文本后用文本API分析，快速便宜但可能丢失图表</div>
            </button>
        </div>

        <div class="status" id="status"></div>

        <div class="info-box">
            <h3>💡 使用说明</h3>
            <p><strong>混合模式：</strong>先提取文本判断复杂度，包含化学式/图表/实验数据的页面用Vision API，纯文字页面用文本API</p>
            <p style="margin-top: 10px;"><strong>成本对比：</strong>假设10页文献，Vision模式100%成本，Text模式20%成本，Hybrid模式约38%成本</p>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:5000';

        // 加载当前模式
        async function loadCurrentMode() {
            try {
                const response = await fetch(`${API_BASE}/api/extraction_mode`);
                const data = await response.json();
                updateUI(data.mode);
            } catch (error) {
                showStatus('加载失败: ' + error.message, 'error');
            }
        }

        // 切换模式
        async function switchMode(mode) {
            try {
                const response = await fetch(`${API_BASE}/api/extraction_mode`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode })
                });
                const data = await response.json();

                if (data.success) {
                    updateUI(mode);
                    showStatus(data.message, 'success');
                } else {
                    showStatus(data.message, 'error');
                }
            } catch (error) {
                showStatus('切换失败: ' + error.message, 'error');
            }
        }

        // 更新UI
        function updateUI(mode) {
            const modeNames = {
                'hybrid': '混合模式 (推荐)',
                'vision': '纯视觉模式',
                'text': '纯文本模式'
            };

            document.getElementById('currentMode').textContent = `当前模式: ${modeNames[mode]}`;

            // 更新按钮状态
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.mode === mode) {
                    btn.classList.add('active');
                }
            });
        }

        // 显示状态消息
        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;

            if (type === 'success') {
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 3000);
            }
        }

        // 绑定按钮事件
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchMode(btn.dataset.mode);
            });
        });

        // 页面加载时获取当前模式
        loadCurrentMode();
    </script>
</body>
</html>
