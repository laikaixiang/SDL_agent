<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lab 智能中枢</title>
    <link rel="stylesheet" href="static/css/main.css">
</head>
<body>
<div class="app-wrapper" id="app-wrapper">

<!-- 算法面板（左侧） -->
<div class="algorithm-panel" id="algorithm-panel">
    <div class="algo-panel-header">
        <span>📊 算法库</span>
        <button onclick="closeAlgorithmPanel()" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:0;line-height:1;">×</button>
    </div>
    <div class="algo-panel-body" id="algo-panel-body">
        <button class="algo-gen-btn" onclick="openAlgorithmGenerator()">✨ 生成新算法</button>
        <div id="algo-list-container">
            <div style="text-align:center;color:#9ca3af;padding:40px 20px;">加载中...</div>
        </div>
    </div>
</div>

<!-- 主聊天区域 -->
<div class="chat-container">
    <div class="header">
        <h1><span class="status-dot"></span>AI Lab 智能中枢</h1>
        <small style="color: var(--text-light)">Agent 提取控制台</small>
    </div>

    <div class="chat-box" id="chat-box">
        <div class="message-row ai">
            <div class="message ai">系统初始化完成。请点击左下角 <b>+</b> 号选择模式，或直接与我对话。</div>
        </div>
    </div>

    <!-- 模式菜单 -->
    <div class="mode-menu" id="mode-menu">
        <div class="mode-item" onclick="setMode('normal', '', '')">💬 普通问答模式</div>
        <div class="mode-item" onclick="setMode('extract', '帮我搜寻：', '📄 文献提取')">📄 文献提取模式</div>
        <div class="mode-item hardware-parent" onmouseenter="showHardwareSubmenu(event)" onmouseleave="hideHardwareSubmenu()">
            ⚙️ 硬件操控模式 ▶
        </div>
        <div class="mode-item" onclick="openAlgorithmPanel()">📊 算法选择</div>
    </div>

    <!-- 硬件子菜单 -->
    <div class="hardware-submenu" id="hardware-submenu" onmouseenter="keepHardwareSubmenu()" onmouseleave="hideHardwareSubmenu()">
        <div class="submenu-item" onclick="openStepPanel()">🔧 单步控制</div>
        <div class="submenu-item" onclick="openExperimentDesignDialog()">🧪 实验设计</div>
    </div>

    <div class="input-area">
        <button id="tool-btn" class="tool-btn">+</button>
        <label for="file-upload" class="tool-btn" style="margin-left:-8px; cursor:pointer;" title="上传文献">📎</label>
        <input type="file" id="file-upload" accept=".pdf" style="display:none;" multiple>
        <div class="input-container" id="input-container">
            <div id="mode-badge" class="mode-badge"></div>
            <input type="text" id="user-input" placeholder="输入问题或指令..." autocomplete="off">
        </div>
        <button id="send-btn" class="send-btn">发送</button>
    </div>
</div>

<!-- PDF 阅读面板（右侧） -->
<div class="pdf-panel" id="pdf-panel">
    <div class="pdf-header">
        <span>AI正在阅读...</span>
        <div style="display:flex;align-items:center;gap:15px;">
            <span id="pdf-title" style="font-size:0.8rem;color:#9ca3af;font-weight:normal;">等待连接...</span>
            <button id="close-pdf-btn" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:0;line-height:1;" title="关闭预览面板">×</button>
        </div>
    </div>
    <div class="pdf-viewer" id="pdf-viewer">
        <div class="scan-line"></div>
        <img id="pdf-image" src="" alt="等待 AI 读取画面..." style="opacity:0;">
    </div>
</div>

<!-- 单步控制面板（右侧） -->
<div class="step-control-panel" id="step-control-panel">
    <div class="step-panel-header">
        <span>🔧 单步控制</span>
        <div style="display:flex;gap:10px;align-items:center;">
            <button id="toggle-step-panel-btn" onclick="toggleStepPanelCollapse()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:0.9rem;cursor:pointer;padding:4px 10px;border-radius:4px;display:none;">◀</button>
            <button onclick="closeStepPanel()" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:0;line-height:1;">×</button>
        </div>
    </div>
    <!-- 辅助函数栏（仅实验设计模式下显示） -->
    <div class="helper-functions" id="helper-functions" style="display:none;">
        <button class="helper-fn-btn" onclick="addHelperFunction('LOOP')">🔁 循环 (LOOP)</button>
        <button class="helper-fn-btn" onclick="addHelperFunction('GROUP')">📦 组 (GROUP)</button>
        <button class="helper-fn-btn" onclick="addHelperFunction('WAIT')">⏱️ 等待 (WAIT)</button>
        <button class="helper-fn-btn" onclick="addHelperFunction('CONDITION')">❓ 条件 (IF)</button>
        <button class="helper-fn-btn" onclick="addHelperFunction('END')">🏁 结束点 (END)</button>
        <button class="helper-fn-btn" onclick="addHelperFunction('USER_INPUT')">✋ 用户输入 (INPUT)</button>
    </div>
    <div class="step-panel-body" id="step-panel-body">
        <div style="text-align:center;color:#9ca3af;padding:40px 20px;">加载中...</div>
    </div>
    <div class="step-status-bar" id="step-status-bar">就绪 — 单击 ▶ 展开工具，双击添加到实验设计</div>
</div>

<!-- 实验设计面板（右侧） -->
<div class="experiment-design-panel" id="experiment-design-panel">
    <div class="exp-panel-header">
        <span>🧪 实验流程</span>
        <button onclick="closeExperimentDesignPanel()" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:0;line-height:1;">×</button>
    </div>
    <div class="exp-panel-body">
        <div class="exp-canvas-area" id="exp-canvas-area">
            <div class="exp-empty-state" id="exp-empty-state">
                <div class="exp-empty-state-icon">🎨</div>
                <div>从左侧单步控制双击工具添加实验步骤</div>
                <div style="font-size:0.8rem;margin-top:8px;">或使用下方输入框让AI自动设计实验流程</div>
            </div>
            <div class="exp-drop-zone" id="exp-drop-zone" style="display:none;">拖拽到此处添加步骤</div>
        </div>
        <div class="exp-code-area" id="exp-code-area">
            <div class="exp-code-header">
                <div class="exp-code-view-tabs">
                    <button class="exp-code-view-btn active" id="code-view-json" onclick="switchCodeView('json')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5H6a3 3 0 0 0-3 3v1a3 3 0 0 1-1.5 2.6A3 3 0 0 1 3 14v1a3 3 0 0 0 3 3h2"/><path d="M16 5h2a3 3 0 0 1 3 3v1a3 3 0 0 0 1.5 2.6A3 3 0 0 0 21 14v1a3 3 0 0 1-3 3h-2"/></svg>
                        JSON
                    </button>
                    <button class="exp-code-view-btn" id="code-view-python" onclick="switchCodeView('python')">
                        <svg width="14" height="14" viewBox="0 0 112 112"><path d="M55 0C28 0 22 12 22 24v19h34v6H14C5 49 0 56 0 71s5 22 14 22h8V73c0-9 5-17 17-17h33c10 0 17-7 17-17V16C89 5 81 0 72 0H55z" fill="#3776AB"/><path d="M57 112c27 0 33-12 33-24V69H56v-6h42c9 0 14-7 14-22s-5-22-14-22h-8v20c0 9-5 17-17 17H40c-10 0-17 7-17 17v23c0 11 8 16 17 16h17z" fill="#FFD43B"/></svg>
                        Python
                    </button>
                </div>
                <div class="exp-code-header-actions">
                    <button class="exp-code-action-btn" onclick="compileToPythonView()" title="编译画布内容为Python代码">
                        <span>⚡</span>
                    </button>
                    <button class="exp-code-action-btn" onclick="syncCodeToCanvas()" title="重新同步代码到画布">
                        <span>↻</span>
                    </button>
                    <button class="exp-code-action-btn" onclick="toggleCodeAreaFullscreen()" title="全屏显示代码">
                        <span id="fullscreen-icon">⛶</span>
                    </button>
                    <button class="exp-code-action-btn" onclick="toggleCodeAreaMinimize()" title="最小化/展开">
                        <span id="minimize-icon">−</span>
                    </button>
                </div>
            </div>
            <textarea class="exp-code-editor" id="exp-code-content" spellcheck="false">// 实验设计JSON将在此显示
{
  "experiment_name": "未命名实验",
  "steps": []
}</textarea>
        </div>
        <div class="exp-toolbar">
            <button class="exp-toolbar-btn" onclick="saveExperimentDesign()">💾 保存设计</button>
            <button class="exp-toolbar-btn" onclick="executeExperimentDesign()">▶ 执行实验</button>
            <button class="exp-toolbar-btn secondary" onclick="clearExperimentDesign()">🗑️ 清空</button>
        </div>
    </div>
</div>

<!-- 步骤编辑模态框 -->
<div class="modal-overlay" id="step-edit-modal">
    <div class="step-edit-modal-content">
        <div id="step-edit-form"></div>
    </div>
</div>

<!-- 提取完成摘要弹窗 -->
<div class="modal-overlay" id="summary-modal">
    <div class="modal">
        <h2>🎉 解析任务已结束</h2>
        <p id="summary-text" style="color:var(--text-light);line-height:1.6;"></p>
        <button class="close-btn" onclick="document.getElementById('summary-modal').style.display='none'">确定</button>
    </div>
</div>

<!-- 文件选择器模态框 -->
<div class="file-selector-modal" id="file-selector-modal">
    <div class="modal-backdrop" onclick="closeFileSelector()"></div>
    <div class="file-selector-content">
        <div class="modal-header">
            <h3 id="file-selector-title">📁 选择数据文件</h3>
            <button class="close-icon" onclick="closeFileSelector()">×</button>
        </div>
        <div class="file-tabs">
            <button class="tab-btn active" id="tab-btn-recent" onclick="switchFileTab('recent')">最近使用</button>
            <button class="tab-btn" id="tab-btn-browse" onclick="switchFileTab('browse')">浏览文件</button>
            <button class="tab-btn" id="tab-btn-custom" onclick="switchFileTab('custom')">自定义路径</button>
            <button class="tab-btn" id="tab-btn-dirs" onclick="switchFileTab('dirs')" style="display:none;">选择目录</button>
        </div>
        <div class="file-list" id="file-list-recent">
            <div style="text-align:center;color:#9ca3af;padding:20px;">加载中...</div>
        </div>
        <div class="file-list" id="file-list-browse" style="display:none;">
            <div id="file-drop-zone" class="upload-drop-zone"
                ondragover="event.preventDefault(); this.classList.add('drag-over')"
                ondragleave="this.classList.remove('drag-over')"
                ondrop="_handleFileDrop(event)">
                <input type="file" id="file-upload-csv" accept=".csv" style="display:none;" onchange="handleCSVUpload(event)">
                <button class="upload-btn" onclick="document.getElementById('file-upload-csv').click()">📤 上传本地CSV文件</button>
                <div class="upload-hint">或将CSV文件拖拽到此处</div>
            </div>
        </div>
        <div class="file-list" id="file-list-custom" style="display:none;">
            <div class="default-path-input">
                <input type="text" id="custom-path-input" placeholder="输入文件路径，如: temporal/extraction.csv" />
                <button class="btn-confirm-path" onclick="confirmCustomPath()">确认</button>
            </div>
        </div>
        <div class="file-list" id="file-list-dirs" style="display:none;">
            <div style="text-align:center;color:#9ca3af;padding:20px;">加载中...</div>
        </div>
    </div>
</div>

</div><!-- /.app-wrapper -->

<!-- JS 模块加载（按依赖顺序） -->
<script src="static/js/state.js"></script>
<script src="static/js/ui/panel.js"></script>
<script src="static/js/ui/menu.js"></script>
<script src="static/js/ui/input_state.js"></script>
<script src="static/js/notification.js"></script>
<script src="static/js/extraction/extraction.js"></script>
<script src="static/js/extraction/file_upload.js"></script>
<script src="static/js/hardware/hardware.js"></script>
<script src="static/js/experiment/experiment_confirm.js"></script>
<script src="static/js/experiment/experiment_design.js"></script>
<script src="static/js/hardware/task_stream.js"></script>
<script src="static/js/hardware/step_panel.js"></script>
<script src="static/js/analysis/analysis.js"></script>
<script src="static/js/analysis/algorithm_panel.js"></script>
<script src="static/js/experiment/experiment_chat.js"></script>
<script src="static/js/chat/chat.js"></script>
</body>
</html>
