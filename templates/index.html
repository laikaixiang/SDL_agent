<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lab 智能中枢</title>
    <style>
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #f3f4f6; --chat-bg: #ffffff;
            --user-msg: #eff6ff; --ai-msg: #f9fafb; --text-main: #1f2937; --text-light: #6b7280;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
        body { background-color: var(--bg); display: flex; justify-content: center; height: 100vh; padding: 20px; }

        .chat-container { width: 100%; max-width: 900px; background: var(--chat-bg); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; position: relative; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .header { padding: 20px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.25rem; color: var(--text-main); display: flex; align-items: center; }
        .status-dot { display: inline-block; width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; margin-right: 8px; }

        .chat-box { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .message-row { display: flex; width: 100%; }
        .message-row.user { justify-content: flex-end; }
        .message { max-width: 80%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; color: var(--text-main); white-space: pre-wrap; word-wrap: break-word; }
        .message.user { background: var(--user-msg); border: 1px solid #bfdbfe; border-bottom-right-radius: 4px; }
        .message.ai { background: var(--ai-msg); border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }

        .task-card { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 16px; margin-top: 10px; font-size: 0.9rem; width: 100%; }
        .task-card .task-log { font-family: monospace; color: #166534; margin-bottom: 8px; }
        .finding-item { background: #fff; padding: 10px; border-radius: 6px; border-left: 4px solid #10b981; margin-top: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .finding-tag { font-weight: bold; color: #047857; margin-bottom: 4px; display: inline-block;}

        /* Agent UI 按钮群 */
        .agent-actions { margin-top: 12px; display: flex; gap: 10px; }
        .btn-yes { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;}
        .btn-yes:hover { background: #059669; }
        .btn-no { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-no:hover { background: #e5e7eb; }

        .input-area { padding: 15px 20px; background: #fff; border-top: 1px solid #e5e7eb; display: flex; align-items: center; gap: 12px; position: relative; }
        .tool-btn { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 50%; width: 40px; height: 40px; font-size: 1.5rem; color: #4b5563; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s; flex-shrink: 0; }
        .tool-btn:hover { background: #e5e7eb; color: var(--primary); }
        .mode-menu { position: absolute; bottom: 70px; left: 20px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 180px; display: none; flex-direction: column; overflow: hidden; z-index: 10; transform-origin: bottom left; animation: popup 0.2s ease-out; }
        @keyframes popup { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .mode-item { padding: 12px 16px; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; border-bottom: 1px solid #f3f4f6; position: relative; }
        .mode-item:hover { background: #eff6ff; color: var(--primary); }
        .hardware-parent { justify-content: space-between; }

        /* 硬件子菜单 */
        .hardware-submenu { position: absolute; bottom: 70px; left: 210px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 220px; display: none; flex-direction: column; overflow: hidden; z-index: 11; transform-origin: bottom left; animation: popup 0.2s ease-out; }
        .submenu-item { padding: 12px 16px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; border-bottom: 1px solid #f3f4f6; }
        .submenu-item:hover { background: #eff6ff; color: var(--primary); }
        .submenu-item:last-child { border-bottom: none; }

        .input-container { flex: 1; display: flex; align-items: center; background: #fff; border: 1px solid #d1d5db; border-radius: 24px; padding: 4px 14px; transition: border 0.2s; overflow: hidden; }
        .input-container.disabled { background: #f3f4f6; cursor: not-allowed; }
        .mode-badge { background: var(--primary); color: white; padding: 4px 10px; border-radius: 16px; font-size: 0.8rem; font-weight: bold; white-space: nowrap; margin-right: 8px; display: none; align-items: center; gap: 4px; }
        .input-container input { flex: 1; border: none; outline: none; padding: 10px 0; font-size: 1rem; width: 100%; background: transparent; }

        .send-btn { background: var(--primary); color: white; border: none; padding: 0 24px; height: 40px; border-radius: 24px; font-weight: 600; cursor: pointer; transition: background 0.2s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .send-btn.cancel-mode { background: #ef4444; } /* 停止提取时的红色按钮 */
        .send-btn.cancel-mode:hover { background: #dc2626; }
        .send-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        /* 左右分屏布局 */
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; background-color: var(--bg); display: flex; justify-content: center; align-items: center; }
        .app-wrapper { display: flex; justify-content: center; margin: 0 auto; width: 100%; max-width: 1400px; height: 100vh; padding: 20px; gap: 20px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }

        /* 实验设计模式下的布局 */
        .app-wrapper.experiment-design-mode {
            justify-content: flex-start;
            gap: 0;
        }
        .app-wrapper.experiment-design-mode .chat-container {
            flex: 0 0 35%;
            max-width: 35%;
        }

        /* PDF 预览面板 */
        .pdf-panel { flex: 0; width: 0; background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; display: flex; flex-direction: column; opacity: 0; transform: translateX(20px); transition: all 0.4s ease; position: relative; }
        .app-wrapper.pdf-mode .pdf-panel { flex: 1; width: 50%; opacity: 1; transform: translateX(0); }
        .app-wrapper.pdf-mode .chat-container { flex: 1; max-width: none; }

        /* 单步控制模式布局 */
        .app-wrapper.step-control-mode .chat-container { flex: 1; max-width: none; }
        .pdf-header { padding: 15px 20px; background: #1f2937; color: #fff; font-weight: bold; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
        .pdf-viewer { flex: 1; position: relative; background: #f3f4f6; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 20px; }
        .pdf-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 4px; transition: opacity 0.3s; }

        /* AI 扫描线动画 */
        .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: rgba(16, 185, 129, 0.7); box-shadow: 0 0 20px rgba(16, 185, 129, 1); display: none; z-index: 10; animation: scan 2.5s ease-in-out infinite alternate; border-radius: 50%; }
        @keyframes scan { 0% { top: 5%; } 100% { top: 95%; } }
        .is-scanning .scan-line { display: block; }

        /* 拖拽上传覆盖层 */
        .chat-container { position: relative; }
        .chat-container.drag-over::after { content: '📁 松开鼠标上传 PDF 至本地库'; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.95); z-index: 100; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; color: var(--primary); font-weight: bold; border: 4px dashed var(--primary); border-radius: 16px; backdrop-filter: blur(5px); }

        /* 转圈动画 */
        .btn-spinner { width: 16px; height: 16px; border: 2px solid #ffffff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal { background: #fff; width: 90%; max-width: 600px; border-radius: 16px; padding: 30px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); text-align: center; }
        .modal h2 { margin-bottom: 15px; color: #10b981; }
        .close-btn { background: var(--primary); color: white; border: none; padding: 10px 30px; border-radius: 8px; cursor: pointer; margin-top: 20px;}

        /* 分析结果卡片 */
        .analysis-card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 16px; margin-top: 10px; font-size: 0.9rem; width: 100%; }
        .analysis-algo { font-weight: bold; color: #1d4ed8; margin-bottom: 4px; font-size: 1rem; }
        .analysis-reason { color: #6b7280; font-size: 0.85rem; margin-bottom: 10px; }
        .analysis-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .analysis-table td { padding: 4px 10px; border-bottom: 1px solid #dbeafe; }
        .analysis-table td:first-child { color: #1e40af; font-weight: bold; width: 50%; }
        .analysis-filepath { font-size: 0.78rem; color: #9ca3af; margin-top: 10px; word-break: break-all; }

        /* 算法列表卡片 */
        .algorithm-list-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-top: 10px; width: 100%; }
        .algorithm-list-card .card-header { font-size: 1.1rem; font-weight: bold; color: #1f2937; margin-bottom: 8px; }
        .algorithm-list-card .card-hint { font-size: 0.85rem; color: #6b7280; margin-bottom: 16px; }
        .algorithm-grid { display: flex; flex-direction: column; gap: 12px; }
        .algo-item { display: flex; align-items: center; gap: 12px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; transition: all 0.2s; cursor: pointer; }
        .algo-item:hover { border-color: #10b981; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.1); }
        .algo-icon { font-size: 2rem; flex-shrink: 0; }
        .algo-content { flex: 1; }
        .algo-name { font-weight: bold; color: #1f2937; font-size: 0.95rem; margin-bottom: 4px; }
        .algo-desc { font-size: 0.8rem; color: #6b7280; margin-bottom: 6px; }
        .algo-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .algo-tag { background: #dbeafe; color: #1e40af; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; }
        .algo-run-btn { background: #10b981; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
        .algo-run-btn:hover { background: #059669; transform: scale(1.1); }

        /* 算法确认卡片 */
        .algorithm-confirm-card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 18px; margin-top: 10px; width: 100%; }
        .selected-algo { margin-bottom: 16px; }
        .algo-badge { display: flex; align-items: center; gap: 8px; background: #1e40af; color: white; padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; width: fit-content; margin-bottom: 8px; }
        .algo-description { font-size: 0.85rem; color: #6b7280; }
        .param-config { background: white; border: 1px solid #dbeafe; border-radius: 6px; padding: 12px; margin-bottom: 16px; }
        .param-title { font-weight: bold; font-size: 0.85rem; color: #1e40af; margin-bottom: 8px; }
        .param-checkbox { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #374151; cursor: pointer; }
        .param-checkbox input { width: 16px; height: 16px; cursor: pointer; }

        /* 文件选择器模态框 */
        .file-selector-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2000; display: none; justify-content: center; align-items: center; }
        .modal-backdrop { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        .file-selector-content { position: relative; background: white; width: 90%; max-width: 600px; max-height: 70vh; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid #e5e7eb; }
        .modal-header h3 { margin: 0; font-size: 1.1rem; color: #1f2937; }
        .close-icon { background: none; border: none; font-size: 2rem; color: #9ca3af; cursor: pointer; line-height: 1; padding: 0; }
        .close-icon:hover { color: #374151; }
        .file-tabs { display: flex; border-bottom: 1px solid #e5e7eb; padding: 0 24px; }
        .tab-btn { background: none; border: none; padding: 12px 20px; font-size: 0.9rem; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab-btn.active { color: #10b981; border-bottom-color: #10b981; font-weight: bold; }
        .file-list { flex: 1; overflow-y: auto; padding: 16px 24px; }
        .file-item { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
        .file-item:hover { border-color: #10b981; background: #f0fdf4; }
        .file-icon { font-size: 1.8rem; flex-shrink: 0; }
        .file-info { flex: 1; }
        .file-name { font-weight: bold; color: #1f2937; font-size: 0.9rem; margin-bottom: 2px; }
        .file-path { font-size: 0.75rem; color: #6b7280; font-family: monospace; margin-bottom: 2px; }
        .file-meta { font-size: 0.7rem; color: #9ca3af; }
        .file-check { font-size: 1.5rem; color: #10b981; opacity: 0; transition: opacity 0.2s; }
        .file-item:hover .file-check { opacity: 1; }
        .upload-btn { width: 100%; padding: 40px; background: #f9fafb; border: 2px dashed #d1d5db; border-radius: 8px; font-size: 1rem; color: #6b7280; cursor: pointer; transition: all 0.2s; }
        .upload-btn:hover { border-color: #10b981; background: #f0fdf4; color: #10b981; }
        .upload-hint { text-align: center; font-size: 0.8rem; color: #9ca3af; margin-top: 12px; }
        .default-path-input { display: flex; gap: 10px; }
        .default-path-input input { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.9rem; }
        .btn-confirm-path { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-confirm-path:hover { background: #059669; }

        /* 实验确认卡片样式 */
        .experiment-confirm-card {
            background: #fef3c7;
            border: 1px solid #fbbf24;
            border-radius: 12px;
            padding: 18px;
            margin-top: 10px;
            width: 100%;
        }

        .experiment-confirm-card .card-header {
            font-size: 1.1rem;
            font-weight: bold;
            color: #92400e;
            margin-bottom: 8px;
        }

        .experiment-confirm-card .card-tool-name {
            font-size: 0.85rem;
            color: #78350f;
            font-family: monospace;
            margin-bottom: 12px;
        }

        .param-list {
            background: white;
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .param-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .param-row:last-child {
            margin-bottom: 0;
        }

        .param-row span:first-child {
            font-weight: bold;
            color: #92400e;
            min-width: 120px;
        }

        .param-row input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .param-hint {
            background: white;
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            color: #78350f;
            font-size: 0.9rem;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        /* 单步控制面板 */
        .step-control-panel {
            position: absolute;
            top: 0; right: 0;
            width: 50%;
            height: 100%;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            z-index: 50;
            transform: translateX(100%);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .step-control-panel.open {
            transform: translateX(0);
            opacity: 1;
        }
        /* 单步控制模式下：相对定位，不覆盖对话区 */
        .app-wrapper.step-control-mode .step-control-panel {
            position: relative;
            flex: 1;
            width: auto;
            transform: translateX(0);
            opacity: 1;
            margin: 0;
        }
        /* 实验设计模式下的布局调整 */
        .app-wrapper.experiment-design-mode .step-control-panel {
            position: relative;
            flex: 0 0 22.75%;
            width: auto;
            transform: translateX(0);
            opacity: 1;
            margin: 0;
            border-radius: 0;
        }
        .app-wrapper.experiment-design-mode .step-control-panel.collapsed {
            flex: 0 0 60px;
        }
        .step-panel-header {
            padding: 15px 20px;
            background: #1f2937;
            color: #fff;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .step-panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .tool-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .tool-row:hover { background: #eff6ff; border-color: #bfdbfe; }
        .tool-row.expanded { background: #f0fdf4; border-color: #86efac; border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 0; }
        .tool-arrow { font-size: 0.75rem; color: #9ca3af; transition: transform 0.2s; flex-shrink: 0; }
        .tool-row.expanded .tool-arrow { transform: rotate(90deg); }
        .tool-name { font-weight: bold; color: #1f2937; font-size: 0.9rem; }
        .tool-desc { font-size: 0.8rem; color: #6b7280; flex: 1; }
        .run-btn {
            width: 32px; height: 32px;
            background: #10b981;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.15s;
        }
        .run-btn:hover:not(:disabled) { background: #059669; transform: scale(1.1); }
        .run-btn:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }
        .run-btn.running { background: #f59e0b; animation: pulse-btn 1s infinite; }
        @keyframes pulse-btn { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .tool-params-area {
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-top: none;
            border-radius: 0 0 8px 8px;
            padding: 14px;
            margin-bottom: 8px;
            display: none;
        }
        .tool-params-area.visible { display: block; }
        .param-field { margin-bottom: 10px; }
        .param-label { font-size: 0.8rem; font-weight: bold; color: #065f46; margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
        .param-badge-req { background: #fca5a5; color: #7f1d1d; font-size: 0.65rem; padding: 1px 5px; border-radius: 4px; }
        .param-badge-opt { background: #d1fae5; color: #065f46; font-size: 0.65rem; padding: 1px 5px; border-radius: 4px; }
        .param-hint { font-size: 0.72rem; color: #6b7280; margin-bottom: 4px; }
        .param-input { width: 100%; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.88rem; }
        .param-input:focus { outline: none; border-color: #10b981; }
        .step-status-bar {
            padding: 8px 16px;
            background: #f3f4f6;
            border-top: 1px solid #e5e7eb;
            font-size: 0.82rem;
            color: #6b7280;
            flex-shrink: 0;
        }
        .step-status-bar.running { background: #fef3c7; color: #92400e; }

        /* 算法面板 - 左侧 */
        .algorithm-panel {
            position: absolute;
            top: 0; left: 0;
            width: 320px;
            height: 100%;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            z-index: 50;
            transform: translateX(-100%);

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const toolBtn = document.getElementById('tool-btn');
    const modeMenu = document.getElementById('mode-menu');
    const modeBadge = document.getElementById('mode-badge');
    const inputContainer = document.getElementById('input-container');

    let currentMode = { id: 'normal', prefix: '', label: '' };
    let abortController = null;      // 用于中断聊天流式响应
    let chatStreaming = false;        // 聊天流式响应中
    let hardwareRunning = false;      // 硬件执行中（不可中断）

    // 算法交互相关全局变量
    let selectedAlgorithm = null;
    let selectedFilePath = null;
    let algorithmParams = {};

    // 单步控制面板
    let stepPanelTools = [];
    let stepRunning = false;
    let stepExpandedTool = null;
    let stepPanelCollapsed = false;

    // 实验设计面板
    let experimentSteps = [];
    let experimentName = "未命名实验";
    let draggedStepIndex = null;

    // =====================================
    // 🎯 面板z-index管理系统
    // =====================================
    // 用于管理多个右侧面板的层级关系，确保后打开的面板显示在上面
    let panelZIndexCounter = 100;        // 面板z-index计数器，从100开始递增
    const activePanels = new Set();      // 跟踪当前打开的面板ID集合

    /**
     * 将面板带到最前面
     * 每次打开面板时调用此函数，确保新打开的面板显示在所有其他面板上面
     *
     * @param {string} panelId - 面板的DOM元素ID
     */
    function bringPanelToFront(panelId) {
        const panel = document.getElementById(panelId);
        if (panel) {
            // 递增计数器并设置z-index
            panelZIndexCounter++;
            panel.style.zIndex = panelZIndexCounter;

            // 添加到活跃面板集合
            activePanels.add(panelId);

            console.log(`[面板管理] ${panelId} 已带到前面，z-index: ${panelZIndexCounter}`);
        }
    }

    /**
     * 从跟踪中移除面板
     * 关闭面板时调用此函数，从活跃面板集合中移除
     *
     * @param {string} panelId - 面板的DOM元素ID
     */
    function removePanelFromTracking(panelId) {
        activePanels.delete(panelId);
        console.log(`[面板管理] ${panelId} 已从跟踪中移除，剩余面板: ${activePanels.size}`);
    }

    toolBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        modeMenu.style.display = modeMenu.style.display === 'flex' ? 'none' : 'flex';
    });
    document.addEventListener('click', () => {
        modeMenu.style.display = 'none';
        hideHardwareSubmenu();
    });

    // 硬件子菜单控制
    let hardwareSubmenuTimer = null;

    function showHardwareSubmenu(event) {
        event.stopPropagation();
        clearTimeout(hardwareSubmenuTimer);
        document.getElementById('hardware-submenu').style.display = 'flex';
    }

    function hideHardwareSubmenu() {
        hardwareSubmenuTimer = setTimeout(() => {
            document.getElementById('hardware-submenu').style.display = 'none';
        }, 200);
    }

    function keepHardwareSubmenu() {
        clearTimeout(hardwareSubmenuTimer);
    }

    function setMode(id, prefix, label) {
        currentMode = { id, prefix, label };
        modeMenu.style.display = 'none';
        hideHardwareSubmenu();
        if (id === 'normal') {
            modeBadge.style.display = 'none';
            userInput.placeholder = '输入问题或指令...';
        } else {
            modeBadge.innerHTML = `${label} <span style="cursor:pointer; margin-left:4px" onclick="event.stopPropagation(); setMode('normal','','')">×</span>`;
            modeBadge.style.display = 'flex';
            userInput.placeholder = '输入要求(可留空默认)...';
        }
        userInput.focus();
    }

    sendBtn.addEventListener('click', handleSendClick);
    userInput.addEventListener('keypress', e => { if (e.key === 'Enter') handleSendClick(); });

    function handleSendClick() {
        if (chatStreaming) {
            stopChatStream();
        } else {
            sendMessage();
        }
    }

    function stopChatStream() {
        if (abortController) {
            abortController.abort();
            abortController = null;
        }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text && currentMode.id === 'normal') return;

        const finalPayload = currentMode.prefix + text;
        const displayHtml = currentMode.id !== 'normal'
            ? `<span style="background:rgba(255,255,255,0.2); padding:2px 6px; border-radius:6px; font-size:0.85em; margin-right:5px;">${currentMode.label}</span> ${text || '专门用于 FAPbI3 钙钛矿体系的钝化剂(Passivator)'}`
            : text;

        console.log('[DEBUG] sendMessage called, text:', text, 'finalPayload:', finalPayload);
        appendMessageHtml(displayHtml, 'user');
        userInput.value = '';
        setNormalLoadingState(true);

        // 特殊处理：数据分析模式
        if (currentMode.id === 'analyze') {
            await handleAnalyzeMode(text);
            setNormalLoadingState(false);
            return;
        }

        abortController = new AbortController();

        try {
            console.log('[DEBUG] Sending request to /api/chat');
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'chat', message: finalPayload }),
                signal: abortController.signal
            });

            console.log('[DEBUG] Response received, status:', response.status);
            const contentType = response.headers.get("content-type");
            console.log('[DEBUG] Content-Type:', contentType);

            if (contentType && contentType.indexOf("application/json") !== -1) {
                setNormalLoadingState(false);
                const data = await response.json();

                if (data.type === 'hardware_confirm') {
                    renderHardwareConfirm(data.tool_calls, data.reply);
                }
                else if (data.type === 'field_confirm') {
                    if (data.task_desc === '硬件控制') {
                        renderHardwareConfirm(data.fields, data.reply);
                    } else {
                        renderFieldConfirm(data.task_desc, data.fields, data.reply);
                    }
                }
                else if (data.type === 'experiment_design_mode') {
                    // 实验设计模式：显示提示后自动启动实验设计 Agent
                    appendMessage(data.reply, 'ai');
                    startExperimentChat(data.command);
                }
                else if (data.type === 'task_trigger') {
                    appendMessage(data.reply, 'ai');
                    startTaskStream();
                } else {
                    appendMessage(data.reply || '', 'ai');
                }
            } else {
                // 流式聊天响应 — 可中断
                console.log('[DEBUG] Processing streaming response');
                setChatStreamingState(true);
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                const msgDiv = createMessageDiv('ai');
                console.log('[DEBUG] Created message div:', msgDiv, 'chatBox:', chatBox);
                try {
                    let chunkCount = 0;
                    while (true) {
                        const { done, value } = await reader.read();
                        chunkCount++;
                        console.log('[DEBUG] Chunk', chunkCount, '- done:', done, 'value length:', value?.length);
                        if (done) break;
                        const decoded = decoder.decode(value, {stream: true});
                        console.log('[DEBUG] Decoded text:', decoded);
                        msgDiv.textContent += decoded;
                        scrollToBottom();
                    }
                    console.log('[DEBUG] Streaming complete, total chunks:', chunkCount);
                } catch (readErr) {
                    console.error('[DEBUG] Read error:', readErr);
                    if (readErr.name !== 'AbortError') throw readErr;
                    msgDiv.textContent += '\n(已停止生成)';
                }
                setChatStreamingState(false);
            }
        } catch (error) {
            if (error.name === 'AbortError') {
                // 用户主动中断，不显示错误
            } else {
                appendMessage('网络连接异常。', 'ai');
            }
            setNormalLoadingState(false);
            setChatStreamingState(false);
        }
        abortController = null;
    }

    // =====================================
    // 🌟 后台提取与中断控制
    // =====================================
    function startTaskStream() {
        setTaskRunningState(true); // 切换UI到暂停模式

        const eventSource = new EventSource('/api/task_stream');
        const row = document.createElement('div');
        row.className = 'message-row ai';
        const card = document.createElement('div');
        card.className = 'task-card';
        card.innerHTML = `<div class="task-log" id="current-log">准备连接解析引擎...</div><div id="findings-container"></div>`;
        row.appendChild(card);
        chatBox.appendChild(row);

        const logEl = card.querySelector('#current-log');
        const findingsEl = card.querySelector('#findings-container');
        scrollToBottom();

        eventSource.onmessage = function(event) {
            const msg = JSON.parse(event.data);
            if (msg.type === 'info' || msg.type === 'progress') {
                logEl.textContent = `> ${msg.data || ''}`;
            }
            else if (msg.type === 'page_reading' && msg.data) {
                // 打开PDF面板显示正在阅读的页面
                const wrapper = document.getElementById('app-wrapper');
                // 只有在非实验设计模式下才打开PDF面板
                if (!wrapper.classList.contains('experiment-design-mode')) {
                    wrapper.classList.add('pdf-mode');
                    document.getElementById('pdf-viewer').classList.add('is-scanning');
                    document.getElementById('pdf-title').textContent = `${msg.data.filename || ''} (第 ${msg.data.page || ''} 页)`;

                    // 将PDF面板带到最前面（z-index管理）
                    bringPanelToFront('pdf-panel');
                }

                const imgEl = document.getElementById('pdf-image');
                if (msg.data.image) {
                    imgEl.src = "data:image/jpeg;base64," + msg.data.image;
                    imgEl.style.opacity = "1";
                }
            }
            else if (msg.type === 'experiment_confirm') {
                // 新增：处理实验确认请求
                renderExperimentConfirm(msg);
            }
            else if (msg.type === 'analysis_result' && msg.data) {
                const d = msg.data;
                const summary = d.result_summary || {};
                let rowsHtml = '';
                for (const [k, v] of Object.entries(summary)) {
                    const display = typeof v === 'number' ? v.toFixed(4) : v;
                    rowsHtml += `<tr><td>${k}</td><td>${display}</td></tr>`;
                }
                const card = document.createElement('div');
                card.className = 'message-row ai';
                card.innerHTML = `<div class="analysis-card">
                    <div class="analysis-algo">📊 ${d.algorithm}</div>
                    <div class="analysis-reason">${d.reasoning}</div>
                    <table class="analysis-table">${rowsHtml}</table>
                    <div class="analysis-filepath">📁 ${d.filepath}</div>
                </div>`;
                chatBox.appendChild(card);
                scrollToBottom();
            }
            else if (msg.type === 'finding' && msg.data) {
                const d = msg.data;
                const findingDiv = document.createElement('div');
                findingDiv.className = 'finding-item';

                // 动态拼装 JSON Keys
                let detailsHtml = '';
                for(let key in d.details) {
                    if(key !== '_source_doc') {
                        detailsHtml += `<span style="color:#374151"><b>${key}:</b> ${d.details[key]}</span><br>`;
                    }
                }
                findingDiv.innerHTML = `<span class="finding-tag">🎯 新发现 (第${d.page}页)</span><br><div style="font-size:0.85rem; padding-left:10px; border-left:2px solid #e5e7eb; margin-top:5px;">${detailsHtml}</div>`;

                findingsEl.appendChild(findingDiv); // 修复: 从下面插入
            } else if (msg.type === 'complete') {
                logEl.textContent = `✅ 任务结束！`;
                logEl.style.color = '#047857';

                // 完成时关闭扫描动画，但保留画面供复盘
                document.getElementById('pdf-viewer').classList.remove('is-scanning');
                document.getElementById('pdf-title').textContent = "任务已完成";

                eventSource.close();
                setTaskRunningState(false); // 恢复正常UI
                const completeData = msg.data || {};
                if (completeData.agent_reply) {
                    // 实验设计 Agent 完成，显示 AI 回复
                    appendMessage(completeData.agent_reply, 'ai');
                } else if (completeData.error) {
                    appendMessage(`❌ 任务失败：${completeData.error}`, 'ai');
                } else if (completeData.algorithm) {
                    // 数据分析任务完成
                    displayAnalysisResult(completeData);
                } else {
                    // 文献提取任务完成
                    showSummaryModal(completeData.csv || '', completeData.count || 0);
                }
            }
            scrollToBottom();
        };

        eventSource.onerror = function() {
            logEl.textContent = `⚠️ 连接断开。`;
            eventSource.close();
            setTaskRunningState(false);
        };
    }

    // =====================================
    // UI 状态控制辅助
    // =====================================
    function setNormalLoadingState(isLoading) {
        if (chatStreaming || hardwareRunning) return; // 不覆盖其他状态
        userInput.disabled = isLoading;
        sendBtn.disabled = isLoading;
        inputContainer.classList.toggle('disabled', isLoading);
        sendBtn.innerHTML = isLoading ? '<div class="btn-spinner"></div>' : '发送';
        if (!isLoading) userInput.focus();
    }

    function setChatStreamingState(isStreaming) {
        chatStreaming = isStreaming;
        if (isStreaming) {
            userInput.disabled = true;
            inputContainer.classList.add('disabled');
            sendBtn.innerHTML = '停止生成';
            sendBtn.className = 'send-btn cancel-mode';
            sendBtn.disabled = false;
        } else {
            userInput.disabled = false;
            inputContainer.classList.remove('disabled');
            sendBtn.innerHTML = '发送';
            sendBtn.className = 'send-btn';
            userInput.focus();
        }
    }

    function setHardwareRunningState(isRunning) {
        hardwareRunning = isRunning;
        if (isRunning) {
            userInput.disabled = true;
            inputContainer.classList.add('disabled');
            sendBtn.innerHTML = '<div class="btn-spinner"></div> 硬件执行中';
            sendBtn.className = 'send-btn';
            sendBtn.disabled = true;
        } else {
            userInput.disabled = false;
            inputContainer.classList.remove('disabled');
            sendBtn.innerHTML = '发送';
            sendBtn.className = 'send-btn';
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    function setTaskRunningState(isRunning) {
        if(isRunning) {
            userInput.disabled = true;
            inputContainer.classList.add('disabled');
            sendBtn.innerHTML = '<div class="btn-spinner"></div> 暂停提取';
            sendBtn.className = 'send-btn cancel-mode';
            sendBtn.onclick = null; // 移除之前的发送逻辑
            sendBtn.addEventListener('click', requestCancelTask); // 绑定中断逻辑
        } else {
            userInput.disabled = false;
            inputContainer.classList.remove('disabled');
            sendBtn.innerHTML = '发送';
            sendBtn.className = 'send-btn';
            sendBtn.removeEventListener('click', requestCancelTask);
            sendBtn.onclick = null;
            userInput.focus();
        }
    }

    fileUpload.addEventListener('change', (e) => handleFiles(e.target.files));

    chatContainer.addEventListener('dragover', (e) => { e.preventDefault(); chatContainer.classList.add('drag-over'); });
    chatContainer.addEventListener('dragleave', (e) => { e.preventDefault(); chatContainer.classList.remove('drag-over'); });

        e.preventDefault();

        handleFiles(e.dataTransfer.files);
    });

    async function handleFiles(files) {
        if (!files || files.length === 0) return;

        const formData = new FormData();
        let pdfCount = 0;

        for (let file of files) {
            if (file.type === "application/pdf" || file.name.toLowerCase().endsWith('.pdf')) {
                formData.append('files', file);
                pdfCount++;
            }
        }

        if (pdfCount === 0) {
            appendMessage('仅支持上传 PDF 格式的文献哦！', 'ai');
            return;
        }

        appendMessage(`正在将 ${pdfCount} 份文献归档至本地知识库...`, 'user');

        try {
            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.status === 'success') {
                appendMessage(`✅ 成功归档！可随时对它们下达提取指令。\n\n已保存：\n${data.saved.join('\n')}`, 'ai');
            } else {
                appendMessage(`❌ 上传失败：${data.error}`, 'ai');
            }
        } catch (e) {
            appendMessage('❌ 网络异常，未能连接到本地服务。', 'ai');
        }

        fileUpload.value = ''; // 清空选择器，允许重复上传同一文件
    }

    // 处理数据分析模式
    async function handleAnalyzeMode(userInput) {
        if (!userInput || userInput.trim() === '') {
            // 空输入，返回算法列表
            try {
                const res = await fetch('/api/list_algorithms');
                const data = await res.json();
                if (data.success) {
                    displayAlgorithmList(data.algorithms);
                } else {
                    appendMessage('获取算法列表失败', 'ai');
                }
            } catch (e) {
                appendMessage('网络异常：' + e.message, 'ai');
            }
        } else {
            // 尝试解析算法名称
            try {
                const res = await fetch('/api/parse_algorithm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_input: userInput })
                });
                const data = await res.json();

                if (data.algorithm_found) {
                    displayAlgorithmConfirm(data.algorithm, data.description, data.icon, data.tags);
                } else {
                    appendMessage('未识别到算法名称，请从列表中选择：', 'ai');
                    displayAlgorithmList(data.available_algorithms);
                }
            } catch (e) {
                appendMessage('网络异常：' + e.message, 'ai');
            }
        }
    }

    // 显示算法执行结果
    function displayAnalysisResult(data) {
        const result = data.result || {};
        let rowsHtml = '';

        // 递归展开结果对象
        function flattenObject(obj, prefix = '') {
            for (const [key, value] of Object.entries(obj)) {
                const fullKey = prefix ? `${prefix}.${key}` : key;
                if (value && typeof value === 'object' && !Array.isArray(value)) {
                    flattenObject(value, fullKey);
                } else {
                    const displayValue = Array.isArray(value)
                        ? `[${value.length} items]`
                        : (typeof value === 'number' ? value.toFixed(4) : String(value));
                    rowsHtml += `<tr><td>${fullKey}</td><td>${displayValue}</td></tr>`;
                }
            }
        }

        flattenObject(result);

        const html = `
            <div class="analysis-card">
                <div class="analysis-algo">✅ ${data.algorithm} 执行完成</div>
                <div class="analysis-reason">数据文件: ${data.file_path}</div>
                <table class="analysis-table">${rowsHtml}</table>
                <div class="analysis-filepath">
                    📁 最新结果: ${data.output_path_latest}<br>
                    📁 存档结果: ${data.output_path_archive}
                </div>
            </div>`;

        appendMessageHtml(html, 'ai');
    }

    // =====================================
    // 🌟 实验设计 Agent 启动
    // =====================================
    async function startExperimentChat(command) {
        // 为每次实验设计对话生成唯一会话ID
        const sessionId = 'exp_' + Date.now();
        window.currentExperimentSession = sessionId;

        setNormalLoadingState(true);
        try {
            const res = await fetch('/api/experiment_chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    session_id: sessionId,
                    message: command
                })
            });
            const data = await res.json();
            setNormalLoadingState(false);

            if (data.type === 'task_trigger') {
                appendMessage(data.reply, 'ai');
                startTaskStream();  // 打开 SSE 监听 Agent 事件（含确认卡片）
            } else if (data.type === 'experiment_design') {
                // 新增：处理实验设计JSON响应
                appendMessage(data.reply, 'ai');

                // 推送JSON到实验设计区域
                if (data.experiment_json) {
                    loadExperimentFromJSON(data.experiment_json);

                    // 显示成功提示
                    showNotification('✅ 实验设计已生成并推送到画布', 'success');
                }
            } else if (data.type === 'error') {
                appendMessage(data.reply, 'ai');
            }
        } catch (e) {
            setNormalLoadingState(false);
            appendMessage('实验设计通信异常: ' + e.message, 'ai');
        }
    }

            html += `

     ondblclick="${dblClickHandler}">

    function renderParamFields(tool) {
        const params = tool.params;
        if (Object.keys(params).length === 0) {
            return '<div style="color:#6b7280;font-size:0.85rem;font-style:italic;">此工具无需参数，直接点击 ▶ 执行</div>';
        }
        let html = '';
        for (const [pName, pInfo] of Object.entries(params)) {
            const badge = pInfo.required
                ? '<span class="param-badge-req">必填</span>'
                : '<span class="param-badge-opt">可选</span>';
            const defaultStr = pInfo.default !== null && pInfo.default !== undefined ? ` 默认:${pInfo.default}` : '';
            html += `
<div class="param-field">
    <div class="param-label">${pName} ${badge}</div>
    <div class="param-hint">${pInfo.description}（${pInfo.type}${defaultStr}）</div>
    <input class="param-input"
           id="param-${tool.name}-${pName}"
           type="text"
           placeholder="${pInfo.default !== null && pInfo.default !== undefined ? pInfo.default : ''}"
           value="${pInfo.default !== null && pInfo.default !== undefined ? pInfo.default : ''}">
</div>`;
        }
        return html;
    }

    function toggleToolExpand(toolName) {
        if (stepExpandedTool === toolName) {
            stepExpandedTool = null;
        } else {
            stepExpandedTool = toolName;
        }
        renderStepTools();
    }

    async function runTool(toolName) {
        if (stepRunning) return;

        const tool = stepPanelTools.find(t => t.name === toolName);
        if (!tool) return;

        const params = {};
        for (const [pName, pInfo] of Object.entries(tool.params)) {
            const inputEl = document.getElementById(`param-${toolName}-${pName}`);
            let val = inputEl ? inputEl.value.trim() : '';
            if (val === '' && pInfo.default !== null && pInfo.default !== undefined) {
                val = String(pInfo.default);
            }
            if (pInfo.type === 'int') params[pName] = parseInt(val) || 0;
            else if (pInfo.type === 'float') params[pName] = parseFloat(val) || 0.0;
            else params[pName] = val;
        }

        for (const [pName, pInfo] of Object.entries(tool.params)) {
            if (pInfo.required && (params[pName] === '' || params[pName] === undefined)) {
                setStepStatus(`❌ 参数 "${pName}" 为必填项`, false);
                return;
            }
        }

        const toolCalls = [{ name: toolName, params }];

        stepRunning = true;
        disableAllRunBtns(toolName);
        setStepStatus(`⏳ 正在执行 ${toolName}...`, true);

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'start_hardware', tool_calls: toolCalls })
            });
            const data = await res.json();
            if (data.status === 'success') {
                setStepStatus(`✅ ${toolName} 执行成功`, false);
                appendMessage(`✅ 单步执行完成 [${toolName}]: ${data.reply || ''}`, 'ai');
            } else {
                setStepStatus(`❌ 执行失败: ${data.reply || '未知错误'}`, false);
                appendMessage(`❌ 单步执行失败 [${toolName}]: ${data.reply || data.error || ''}`, 'ai');
            }
        } catch (e) {
            setStepStatus(`❌ 网络错误`, false);
        } finally {
            stepRunning = false;
            enableAllRunBtns();
        }
    }

    function disableAllRunBtns(activeToolName) {
        for (const tool of stepPanelTools) {
            const btn = document.getElementById(`run-btn-${tool.name}`);
            if (!btn) continue;
            if (tool.name === activeToolName) {
                btn.classList.add('running');
                btn.textContent = '⏳';
            } else {
                btn.disabled = true;
            }
        }
    }

    function enableAllRunBtns() {
        for (const tool of stepPanelTools) {
            const btn = document.getElementById(`run-btn-${tool.name}`);
            if (!btn) continue;
            btn.disabled = false;
            btn.classList.remove('running');
            btn.textContent = '▶';
        }
    }

    function setStepStatus(msg, isRunning) {
        const bar = document.getElementById('step-status-bar');
        if (!bar) return;
        bar.textContent = msg;
        bar.className = 'step-status-bar' + (isRunning ? ' running' : '');
    }

        expPanel.classList.add('open');
        bringPanelToFront('experiment-design-panel');

        // 显示辅助函数栏
        document.getElementById('helper-functions').style.display = 'flex';

        // 更新单步控制状态栏提示
        setStepStatus('实验设计模式 — 双击工具添加到右侧画布', false);
    }

    function closeExperimentDesignPanel() {
        const panel = document.getElementById('experiment-design-panel');
        panel.classList.remove('open');

        // 隐藏辅助函数栏
        document.getElementById('helper-functions').style.display = 'none';

        // 隐藏折叠按钮
        document.getElementById('toggle-step-panel-btn').style.display = 'none';

        // 恢复单步控制状态栏
        setStepStatus('就绪 — 单击 ▶ 展开工具，点击右侧 ▶ 执行', false);

        // 从面板跟踪中移除
        removePanelFromTracking('experiment-design-panel');

        // 移除实验设计模式
        const wrapper = document.getElementById('app-wrapper');
        wrapper.classList.remove('experiment-design-mode');

        // 同时关闭单步控制面板
        const stepPanel = document.getElementById('step-control-panel');
        stepPanel.classList.remove('open');
        stepPanel.classList.remove('collapsed');
        removePanelFromTracking('step-control-panel');

        // 恢复普通模式
        setMode('normal', '', '');
    }

    // 折叠/展开单步控制面板
    function toggleStepPanelCollapse() {
        const panel = document.getElementById('step-control-panel');
        const btn = document.getElementById('toggle-step-panel-btn');
        const wrapper = document.getElementById('app-wrapper');
        const isExpDesignMode = wrapper.classList.contains('experiment-design-mode');

        stepPanelCollapsed = !stepPanelCollapsed;

        if (stepPanelCollapsed) {
            panel.classList.add('collapsed');
            btn.textContent = '▶';
            document.getElementById('step-panel-body').style.display = 'none';
            document.getElementById('step-status-bar').style.display = 'none';
            document.getElementById('helper-functions').style.display = 'none';
        } else {
            panel.classList.remove('collapsed');
            btn.textContent = '◀';
            document.getElementById('step-panel-body').style.display = 'block';
            document.getElementById('step-status-bar').style.display = 'block';
            if (isExpDesignMode) {
                document.getElementById('helper-functions').style.display = 'flex';
            }
        }
    }

    // 添加步骤到实验设计（双击工具时调用）
    function addStepToExperiment(toolName) {
        const tool = stepPanelTools.find(t => t.name === toolName);
        if (!tool) return;

        // 收集当前参数值
        const params = {};
        for (const [pName, pInfo] of Object.entries(tool.params)) {
            const inputEl = document.getElementById(`param-${toolName}-${pName}`);
            let val = inputEl ? inputEl.value.trim() : '';
            if (val === '' && pInfo.default !== null && pInfo.default !== undefined) {
                val = String(pInfo.default);
            }
            if (pInfo.type === 'int') params[pName] = parseInt(val) || 0;
            else if (pInfo.type === 'float') params[pName] = parseFloat(val) || 0.0;
            else params[pName] = val;
        }

        // 添加到实验步骤列表
        experimentSteps.push({
            type: 'tool',
            name: toolName,
            description: tool.description,
            params: params
        });

        // 更新UI
        renderExperimentSteps();
        updateExperimentJSON();

        // 提示用户
        setStepStatus(`✅ 已添加步骤: ${toolName}`, false);
    }

    // 添加辅助函数
    function addHelperFunction(fnType) {
        let step = null;

        switch(fnType) {
            case 'LOOP':
                step = {
                    type: 'helper',
                    name: 'LOOP',
                    description: '循环执行',
                    params: { iterations: 3, steps: [] }
                };
                break;
            case 'GROUP':
                step = {
                    type: 'helper',
                    name: 'GROUP',
                    description: '步骤组',
                    params: { name: '步骤组', steps: [] }
                };
                break;
            case 'WAIT':
                step = {
                    type: 'helper',
                    name: 'WAIT',
                    description: '等待',
                    params: { duration: 5000 }
                };
                break;
            case 'CONDITION':
                step = {
                    type: 'helper',
                    name: 'CONDITION',
                    description: '条件判断',
                    params: { condition: 'temperature > 100', then_steps: [], else_steps: [] }
                };
                break;
        }

        if (step) {
            experimentSteps.push(step);
            renderExperimentSteps();
            updateExperimentJSON();
        }
    }

    // 渲染实验步骤列表
    function renderExperimentSteps() {
        const canvas = document.getElementById('exp-canvas-area');
        const emptyState = document.getElementById('exp-empty-state');

        if (experimentSteps.length === 0) {
            emptyState.style.display = 'block';
            // 移除所有步骤元素
            const existingSteps = canvas.querySelectorAll('.exp-step-item');
            existingSteps.forEach(el => el.remove());
            return;
        }

        emptyState.style.display = 'none';

        // 清空现有步骤
        const existingSteps = canvas.querySelectorAll('.exp-step-item');
        existingSteps.forEach(el => el.remove());

        // 渲染每个步骤
        experimentSteps.forEach((step, index) => {
            const stepEl = document.createElement('div');
            stepEl.className = 'exp-step-item';
            stepEl.draggable = true;
            stepEl.dataset.index = index;

            // 拖拽事件
            stepEl.addEventListener('dragstart', (e) => {
                draggedStepIndex = index;
                stepEl.classList.add('dragging');
            });
            stepEl.addEventListener('dragend', (e) => {
                stepEl.classList.remove('dragging');
                draggedStepIndex = null;
            });
            stepEl.addEventListener('dragover', (e) => {
                e.preventDefault();
            });
            stepEl.addEventListener('drop', (e) => {
                e.preventDefault();
                if (draggedStepIndex !== null && draggedStepIndex !== index) {
                    // 交换步骤顺序
                    const temp = experimentSteps[draggedStepIndex];
                    experimentSteps.splice(draggedStepIndex, 1);
                    experimentSteps.splice(index, 0, temp);
                    renderExperimentSteps();
                    updateExperimentJSON();
                }
            });

            // 步骤内容
            let paramsHtml = '';
            if (step.type === 'tool') {
                for (const [key, value] of Object.entries(step.params)) {
                    paramsHtml += `<div><strong>${key}:</strong> ${value}</div>`;
                }
            } else if (step.type === 'helper') {
                paramsHtml = `<div style="color:#7c3aed;font-style:italic;">${JSON.stringify(step.params)}</div>`;
            }

            stepEl.innerHTML = `
                <div class="exp-step-header">
                    <div class="exp-step-type">${index + 1}. ${step.name}</div>
                    <div class="exp-step-controls">
                        <button class="exp-step-btn" onclick="moveStepUp(${index})" title="上移">▲</button>
                        <button class="exp-step-btn" onclick="moveStepDown(${index})" title="下移">▼</button>
                        <button class="exp-step-btn" onclick="editStep(${index})" title="编辑">✏️</button>
                        <button class="exp-step-btn" onclick="deleteStep(${index})" title="删除">🗑️</button>
                    </div>
                </div>
                <div style="font-size:0.8rem;color:#6b7280;margin-bottom:6px;">${step.description}</div>
                <div class="exp-step-params">${paramsHtml}</div>
            `;

            canvas.appendChild(stepEl);
        });
    }

    // 更新JSON代码显示
    function updateExperimentJSON() {
        const json = {
            experiment_name: experimentName,
            created_at: new Date().toISOString(),
            steps: experimentSteps
        };

        const codeContent = document.getElementById('exp-code-content');
        codeContent.value = JSON.stringify(json, null, 2);
    }

    // 最小化/展开代码区域
    function toggleCodeAreaMinimize() {
        const codeArea = document.getElementById('exp-code-area');
        const icon = document.getElementById('minimize-icon');

        if (codeArea.classList.contains('minimized')) {
            codeArea.classList.remove('minimized');
            icon.textContent = '▼';
        } else {
            codeArea.classList.add('minimized');
            icon.textContent = '▲';
        }
    }

    // 步骤操作函数
    function moveStepUp(index) {
        if (index > 0) {
            const temp = experimentSteps[index];
            experimentSteps[index] = experimentSteps[index - 1];
            experimentSteps[index - 1] = temp;
            renderExperimentSteps();
            updateExperimentJSON();
        }
    }

    function moveStepDown(index) {
        if (index < experimentSteps.length - 1) {
            const temp = experimentSteps[index];
            experimentSteps[index] = experimentSteps[index + 1];
            experimentSteps[index + 1] = temp;
            renderExperimentSteps();
            updateExperimentJSON();
        }
    }

    function editStep(index) {
        const step = experimentSteps[index];
        const newParams = prompt(`编辑步骤参数 (JSON格式):\n当前: ${JSON.stringify(step.params)}`, JSON.stringify(step.params));
        if (newParams) {
            try {
                step.params = JSON.parse(newParams);
                renderExperimentSteps();
                updateExperimentJSON();
            } catch (e) {
                alert('JSON格式错误: ' + e.message);
            }
        }
    }

    function deleteStep(index) {
        if (confirm('确定删除此步骤？')) {
            experimentSteps.splice(index, 1);
            renderExperimentSteps();
            updateExperimentJSON();
        }
    }

    function clearExperimentDesign() {
        if (confirm('确定清空所有实验步骤？')) {
            experimentSteps = [];
            experimentName = "未命名实验";
            renderExperimentSteps();
            updateExperimentJSON();
        }
    }

    // 从JSON加载实验设计
    function loadExperimentFromJSON(json) {
        try {
            // 更新实验名称
            experimentName = json.experiment_name || "未命名实验";

            // 转换steps格式（统一为前端格式）
            experimentSteps = json.steps.map((step, index) => {
                return {
                    type: step.type || "tool",
                    name: step.name || step.action || "",
                    params: step.params || {},
                    description: step.description || ""
                };
            });

            // 重新渲染画布和JSON
            renderExperimentSteps();
            updateExperimentJSON();

            console.log(`[实验设计] 已加载实验: ${experimentName}, 步骤数: ${experimentSteps.length}`);
        } catch (e) {
            console.error('[实验设计] 加载JSON失败:', e);
            alert('加载实验设计失败: ' + e.message);
        }
    }

    // 显示通知
    function showNotification(message, type = 'info') {
        // 创建通知元素
        const notification = document.createElement('div');
        notification.className = `notification notification-${type}`;
        notification.textContent = message;
        notification.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6'};
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10000;
            animation: slideIn 0.3s ease-out;
            max-width: 400px;
        `;

        document.body.appendChild(notification);

        // 3秒后自动移除
        setTimeout(() => {
            notification.style.animation = 'slideOut 0.3s ease-out';
            setTimeout(() => notification.remove(), 300);
        }, 3000);
    }

    // 保存实验设计到文件夹
    async function saveExperimentDesign() {
        const name = prompt('请输入实验名称:', experimentName);
        if (!name) return;

        experimentName = name;
        updateExperimentJSON();

        const json = {
            experiment_name: experimentName,
            created_at: new Date().toISOString(),
            steps: experimentSteps
        };

        try {
            const response = await fetch('/api/save_experiment_design', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(json)
            });

            const data = await response.json();
            if (data.success) {
                appendMessage(`✅ 实验设计已保存: ${data.filepath}`, 'ai');
            } else {
                appendMessage(`❌ 保存失败: ${data.message}`, 'ai');
            }
        } catch (e) {
            appendMessage(`❌ 保存异常: ${e.message}`, 'ai');
        }
    }

    // 执行实验设计
    async function executeExperimentDesign() {
        if (experimentSteps.length === 0) {
            alert('请先添加实验步骤');
            return;
        }

        if (!confirm(`确定执行实验 "${experimentName}"？\n共 ${experimentSteps.length} 个步骤`)) {
            return;
        }

        const json = {
            experiment_name: experimentName,
            created_at: new Date().toISOString(),
            steps: experimentSteps
        };

        appendMessage(`🚀 开始执行实验: ${experimentName}`, 'user');

        try {
            const response = await fetch('/api/execute_experiment_design', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(json)
            });

            const data = await response.json();
            if (data.type === 'task_trigger') {
                appendMessage(data.reply, 'ai');
                startTaskStream();
            } else {
                appendMessage(data.reply || '执行失败', 'ai');
            }
        } catch (e) {
            appendMessage(`❌ 执行异常: ${e.message}`, 'ai');
        }
    }

    // 导出JSON文件到服务器
    async function exportExperimentJSON() {
        const json = {
            experiment_name: experimentName,
            created_at: new Date().toISOString(),
            steps: experimentSteps
        };

        const filename = `${experimentName}_${Date.now()}.json`;

        // 获取当前会话的默认路径
        let defaultPath = `experiment_designs/${filename}`;

        // 尝试从服务器获取会话路径
        try {
            const sessionResponse = await fetch('/api/get_session_path?subdir=experiment_designs');
            const sessionData = await sessionResponse.json();
            if (sessionData.success) {
                defaultPath = `${sessionData.path}/${filename}`;
            }
        } catch (e) {
            console.log('无法获取会话路径，使用默认路径');
        }

        const savePath = prompt('请输入保存路径:', defaultPath);
        if (!savePath) return; // 用户取消

        try {
            const response = await fetch('/api/export_experiment_json', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    json_data: json,
                    filepath: savePath
                })
            });

            const data = await response.json();
            if (data.success) {
                appendMessage(`📤 实验设计已导出: ${data.filepath}`, 'ai');
            } else {
                appendMessage(`❌ 导出失败: ${data.message}`, 'ai');
            }
        } catch (e) {
            appendMessage(`❌ 导出异常: ${e.message}`, 'ai');
        }
    }


</script>
