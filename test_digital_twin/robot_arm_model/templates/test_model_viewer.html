<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>STL Viewer - test_model.stl</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
       background: #1a1d23; color: #abb2bf; overflow: hidden; height: 100vh;
       display: flex; flex-direction: column; }
#info { padding: 10px 16px; background: #21252b; border-bottom: 1px solid #333;
        font-size: 12px; display: flex; gap: 16px; }
#info .label { color: #61afef; }
#info .value { color: #e5c07b; }
#canvas { flex: 1; }
</style>
</head>
<body>
<div id="info">
  <span><span class="label">文件:</span> <span class="value" id="fname">test_model.stl</span></span>
  <span><span class="label">三角面:</span> <span class="value" id="tris">-</span></span>
  <span><span class="label">状态:</span> <span class="value" id="status">加载中...</span></span>
</div>
<div id="canvas"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const container = document.getElementById('canvas');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1e2127');

const camera = new THREE.PerspectiveCamera(50, 1, 1, 5000);
camera.position.set(100, 80, 100);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight('#8899bb', 1.2));
const key = new THREE.DirectionalLight('#fffef5', 2.5);
key.position.set(150, 200, 100);
key.castShadow = true;
scene.add(key);

const grid = new THREE.GridHelper(400, 8, '#4a4f59', '#2a2d33');
scene.add(grid);

const loader = new STLLoader();
loader.load('./models/test_model.stl',
  (geometry) => {
    geometry.computeBoundingBox();
    const center = new THREE.Vector3();
    geometry.boundingBox.getCenter(center);
    geometry.translate(-center.x, -center.y, -center.z);
    
    const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
      color: 0x61afef, roughness: 0.35, metalness: 0.6
    }));
    mesh.castShadow = true;
    scene.add(mesh);
    
    document.getElementById('tris').textContent = (geometry.attributes.position.count / 3).toLocaleString();
    document.getElementById('status').textContent = '加载成功';
    document.getElementById('status').style.color = '#98c379';
    
    const size = new THREE.Vector3();
    geometry.boundingBox.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.set(maxDim * 2, maxDim * 1.5, maxDim * 2);
    controls.target.set(0, 0, 0);
    controls.update();
  },
  undefined,
  (error) => {
    document.getElementById('status').textContent = '失败: ' + error;
    document.getElementById('status').style.color = '#e06c75';
  }
);

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

(function render() {
  requestAnimationFrame(render);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
