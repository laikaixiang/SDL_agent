<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Dobot M1Pro 装配预览</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
       background: #1a1d23; color: #abb2bf; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
#info { padding: 12px 20px; background: #21252b; border-bottom: 1px solid #333;
        font-size: 12px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
#info .label { color: #61afef; font-weight: 600; }
#info .value { color: #e5c07b; }
#parts { display: flex; gap: 10px; align-items: center; margin-left: auto; flex-wrap: wrap; }
#parts .part { padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;
               border: 1px solid #333; transition: all 0.2s; }
#parts .part:hover { border-color: #61afef; }
#parts .part.active { background: #61afef; color: #1a1d23; border-color: #61afef; }
#canvas { flex: 1; position: relative; }
#controls { position: absolute; bottom: 16px; left: 16px; background: rgba(33,37,43,0.9);
            padding: 8px 12px; border-radius: 6px; font-size: 11px; color: #888; }
#status-line { position: absolute; bottom: 16px; right: 16px; background: rgba(33,37,43,0.9);
               padding: 8px 12px; border-radius: 6px; font-size: 11px; color: #e5c07b; }
</style>
</head>
<body>
<div id="info">
  <span><span class="label">装配:</span> <span class="value">Dobot M1Pro 机械臂</span></span>
  <span><span class="label">总三角面:</span> <span class="value">114,848</span></span>
  <span><span class="label">零件数:</span> <span class="value">5</span></span>
  <div id="parts">
    <span class="part active" data-part="all">全部</span>
    <span class="part" data-part="M1_AXIS1_1">AXIS1 基座</span>
    <span class="part" data-part="M1_AXIS2_1">AXIS2</span>
    <span class="part" data-part="M1_AXIS3_1">AXIS3</span>
    <span class="part" data-part="M1_AXIS4_1">AXIS4</span>
    <span class="part" data-part="M1_ROTATE_1">ROTATE</span>
  </div>
</div>
<div id="canvas"></div>
<div id="controls">鼠标拖拽旋转 | 滚轮缩放 | 右键平移 | 点击零件名筛选</div>
<div id="status-line">加载中...</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const container = document.getElementById('canvas');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1e2127');
scene.fog = new THREE.Fog('#1e2127', 1500, 4000);

// Assembly spans X[0.8–635], Y[1–231], Z[0–688], geometric center ~(318, 116, 344)
// CAD Z (688mm tallest) → Three.js Y (up) via Rx(-90°) so robot stands perpendicular to ground
const ASSEMBLY_CENTER = new THREE.Vector3(318, 116, 344);
const assemblyGroup = new THREE.Group();
// Position group so rotated base (old Z≈0) lands on Y≈0:
//   world_y_base = group.y + (0 - 344) = 0 → group.y = 344
assemblyGroup.position.set(318, 344, 344);
scene.add(assemblyGroup);

const camera = new THREE.PerspectiveCamera(45, 1, 1, 5000);
camera.position.set(500, 500, 900);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(318, 344, 344);
controls.update();

scene.add(new THREE.AmbientLight('#8899bb', 1.8));
const key = new THREE.DirectionalLight('#fffef5', 4);
key.position.set(600, 800, 500);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 10;
key.shadow.camera.far = 3000;
key.shadow.camera.left = -800;
key.shadow.camera.right = 800;
key.shadow.camera.top = 800;
key.shadow.camera.bottom = -400;
scene.add(key);
scene.add(new THREE.DirectionalLight('#aaccff', 1.5));

// Ground plane at Y=0, centered under the assembly
const grid = new THREE.GridHelper(1000, 20, '#4a4f59', '#2a2d33');
grid.position.set(318, 0, 344);
scene.add(grid);

// Axes helper for orientation
scene.add(new THREE.AxesHelper(300));

// Debug: X,Y,Z labels at axis ends
(function addAxisLabels() {
  function lbl(text, x, y, z, color) {
    const c = document.createElement('canvas'); c.width=128; c.height=128;
    const t = c.getContext('2d');
    t.fillStyle=color; t.font='bold 80px Arial'; t.textAlign='center'; t.textBaseline='middle';
    t.fillText(text, 64, 64);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), depthTest:false}));
    s.position.set(x, y, z); s.scale.set(35, 35, 1); return s;
  }
  scene.add(lbl('X', 330, 0, 0, '#ff4444'));
  scene.add(lbl('Y', 0, 330, 0, '#44ff44'));
  scene.add(lbl('Z', 0, 0, 330, '#4488ff'));
})();

// Part definitions — vertices are in assembly world coordinates, NO centering needed
const parts = [
  { name: 'M1_AXIS1_1',  color: 0x7a9f6a, label: 'AXIS1 基座' },
  { name: 'M1_AXIS2_1',  color: 0x8a6a9f, label: 'AXIS2' },
  { name: 'M1_AXIS3_1',  color: 0x5a8faf, label: 'AXIS3' },
  { name: 'M1_AXIS4_1',  color: 0x9f8a6a, label: 'AXIS4' },
  { name: 'M1_ROTATE_1', color: 0x6a8caf, label: 'ROTATE' },
];

const meshes = {};
const totalParts = parts.length;
let loadedCount = 0;

const statusEl = document.getElementById('status-line');

// Toggle part visibility — exposed to window for inline onclick
window.togglePart = function(partName) {
  document.querySelectorAll('#parts .part').forEach(el => {
    el.classList.toggle('active', el.dataset.part === partName);
  });

  Object.entries(meshes).forEach(([name, mesh]) => {
    mesh.visible = (partName === 'all' || name === partName);
  });
};

// Bind click events
document.querySelectorAll('#parts .part').forEach(el => {
  el.addEventListener('click', () => window.togglePart(el.dataset.part));
});

const loader = new STLLoader();

parts.forEach(({ name, color, label }) => {
  loader.load('../models/dobot_m1pro/' + name + '.stl',
    (geometry) => {
      // Vertices are in assembly world coordinates from STEP split.
      // Center geometry at local origin, then position mesh relative to assembly group.
      geometry.computeBoundingBox();
      const partCenter = new THREE.Vector3();
      geometry.boundingBox.getCenter(partCenter);
      geometry.translate(-partCenter.x, -partCenter.y, -partCenter.z);

      const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
        color: color, roughness: 0.3, metalness: 0.7
      }));

      // Position relative to assembly group center
      mesh.position.copy(partCenter).sub(ASSEMBLY_CENTER);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.name = name;

      assemblyGroup.add(mesh);
      meshes[name] = mesh;

      loadedCount++;
      if (loadedCount === totalParts) {
        // Rx(-90°): CAD Z-up (688mm tallest axis) maps to Three.js Y-up
        assemblyGroup.rotation.x = -Math.PI / 2;
        statusEl.textContent = '全部加载完成';
        statusEl.style.color = '#98c379';
        console.log('[Assembly] All parts loaded, rotated Y 90°:', Object.keys(meshes));
      } else {
        statusEl.textContent = `已加载 ${loadedCount}/${totalParts}`;
      }
    },
    undefined,
    (error) => {
      console.error('[STL] Error loading ' + name + ':', error);
      statusEl.textContent = `加载失败: ${name}`;
      statusEl.style.color = '#e06c75';
      loadedCount++;
    }
  );
});

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

(function render() {
  requestAnimationFrame(render);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
