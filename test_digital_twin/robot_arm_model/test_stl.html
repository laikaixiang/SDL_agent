<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>STL Loading Test</title>
</head>
<body>
  <div id="info"></div>
  
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  
  <script type="module">
    import * as THREE from 'three';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';
    
    const loader = new STLLoader();
    
    // Load STL file
    loader.load('./test_model.stl', (geometry) => {
      const material = new THREE.MeshStandardMaterial({
        color: 0x888888,
        roughness: 0.5,
        metalness: 0.3
      });
      
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(100, 0, 100);
      mesh.rotation.x = -Math.PI / 2; // STL often comes in Z-up
      scene.add(mesh);
      
      document.getElementById('info').textContent = 
        'STL loaded: ' + geometry.attributes.position.count + ' vertices';
    }, undefined, (error) => {
      console.error('Error loading STL:', error);
      document.getElementById('info').textContent = 'Error: ' + error;
    });
  </script>
</body>
</html>
